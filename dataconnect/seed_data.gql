# Ce seed reproduit les données fictives utilisées par le front (src/data/*.ts)
# pour permettre un aller-retour complet UI ↔ SQL Connect sans dépendre du mode
# mémoire. Il est destiné à l'émulateur et/ou à l'environnement sandbox — pas
# à la production.
#
# Conventions d'IDs (UUID déterministes pour faciliter le debug) :
#   clients   → aaaaaaaa-0000-0000-0000-00000000000X
#   chantiers → bbbbbbbb-0000-0000-0000-00000000000X
#   factures  → cccccccc-0000-0000-0000-00000000000X
#
# Les utilisateurs (User) ne sont PAS seedés ici : leurs IDs sont des Firebase
# Auth UIDs qui n'existent qu'après création dans Firebase Auth. Les chantiers
# n'affectent donc pas de `chefChantierId` dans ce seed — l'affectation se fera
# plus tard, une fois les comptes Auth provisionnés.
# =============================================================================

