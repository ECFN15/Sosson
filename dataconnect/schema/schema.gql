# =============================================================================
# Schéma SQL Connect — Sosson
# =============================================================================
# Source de vérité relationnelle pour les entités métier :
#   - User      : utilisateur interne (lié à Firebase Auth via auth.uid)
#   - Client    : client final (donneur d'ordre)
#   - Chantier  : dossier opérationnel rattaché à un client
#   - Devis     : objet entre demande client/prospect et chantier confirme
#   - Facture   : facture fournisseur rattachée à un chantier
#
# Les champs dérivés (dépenses engagées d'un chantier, tendance budget, etc.)
# ne sont PAS stockés ici : ils se calculent à la volée via les relations
# `factures_on_chantier` et se matérialisent côté client/backend.
#
# Conventions :
#   - IDs techniques en UUID (`@default(expr: "uuidV4()")`)
#   - User.id est une exception : c'est le Firebase Auth UID (String)
#   - Dates civiles en `Date`, horodatages système en `Timestamp`
#   - Montants en `numeric(12, 2)` pour éviter les flottants
#   - Enums représentés en `varchar` avec liste des valeurs en commentaire
# =============================================================================


# Utilisateur interne de l'entreprise Sosson.
# L'identifiant est le Firebase Auth UID, injecté automatiquement à l'insert.
type User @table {
  id: String! @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(254)")
  nom: String! @col(dataType: "varchar(80)")
  prenom: String! @col(dataType: "varchar(80)")
  # Rôle applicatif : "gerant" | "assistante" | "chef_chantier" | "ouvrier"
  role: String! @col(dataType: "varchar(32)")
  # Statut d'activation du profil applicatif : "actif" | "a_classer" | "suspendu"
  profilStatut: String @default(value: "actif") @col(dataType: "varchar(32)")
  # Demande initiale saisie par l'utilisateur : "chantier" | "chantier_bureau" | "administratif" | "gerant"
  equipeTypeSouhaite: String @col(dataType: "varchar(32)")
  # Identifiant de l'equipe front/local creee pendant la transposition.
  equipeFinaleId: String @col(dataType: "varchar(120)")
  poste: String @col(dataType: "varchar(120)")
  telephone: String @col(dataType: "varchar(32)")
  sourceConnexion: String @col(dataType: "varchar(32)")
  # Initiales d'affichage pour l'avatar (ex : "PS")
  avatar: String @col(dataType: "varchar(8)")
  dateActivation: Timestamp
  dateModification: Timestamp! @default(expr: "request.time")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Demande de profil creee apres une premiere connexion Firebase Auth.
# Cette table ne donne aucun droit applicatif: elle sert de file d'attente
# pour que le gerant classe la personne dans l'equipe et cree le vrai User SQL.
type TeamProfileSubmission @table {
  id: String! @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(254)")
  nom: String! @col(dataType: "varchar(80)")
  prenom: String! @col(dataType: "varchar(80)")
  requestedTeamType: String! @col(dataType: "varchar(32)")
  # Statut : "pending" | "converted" | "rejected"
  status: String! @default(value: "pending") @col(dataType: "varchar(32)")
  sourceConnexion: String @col(dataType: "varchar(32)")
  convertedTeamId: String @col(dataType: "varchar(120)")
  convertedMemberId: String @col(dataType: "varchar(120)")
  reviewNote: String
  reviewedBy: User
  reviewedAt: Timestamp
  dateModification: Timestamp! @default(expr: "request.time")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Equipe finale Sosson utilisee pour l'affectation RH et planning.
type SossonTeam @table {
  code: String! @col(dataType: "varchar(64)")
  name: String! @col(dataType: "varchar(120)")
  # Type : "chantier" | "chantier_bureau" | "administratif" | "gerant"
  type: String! @col(dataType: "varchar(32)")
  # Statut : "active" | "archive"
  statut: String! @default(value: "active") @col(dataType: "varchar(32)")
  theme: String @col(dataType: "varchar(32)")
  leadName: String @col(dataType: "varchar(160)")
  description: String
  # Liste simple separee par des virgules tant que les sites/equipes n'ont pas
  # besoin d'une table dediee.
  activeSites: String
  ordre: Int
  dateModification: Timestamp! @default(expr: "request.time")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Fiche de poste RH liee a une equipe finale. Le lien vers User est optionnel
# pour permettre les fiches chantier sans compte applicatif.
type SossonTeamMember @table {
  user: User
  team: SossonTeam!
  firstName: String! @col(dataType: "varchar(80)")
  lastName: String! @col(dataType: "varchar(80)")
  title: String! @col(dataType: "varchar(120)")
  qualification: String @col(dataType: "varchar(160)")
  level: String @col(dataType: "varchar(120)")
  salaryGrossMonthly: Float @col(dataType: "numeric(12, 2)")
  contract: String @col(dataType: "varchar(80)")
  coefficient: String @col(dataType: "varchar(80)")
  email: String @col(dataType: "varchar(254)")
  phone: String @col(dataType: "varchar(32)")
  # Statut : "terrain" | "atelier" | "bureau" | "absent"
  status: String! @default(value: "terrain") @col(dataType: "varchar(32)")
  site: String @col(dataType: "varchar(160)")
  activeSites: String
  responsibilities: String
  permissions: String
  dateModification: Timestamp! @default(expr: "request.time")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Absence/conge rattache a une fiche membre.
type SossonTeamLeavePeriod @table {
  member: SossonTeamMember!
  type: String! @col(dataType: "varchar(32)")
  month: String! @col(dataType: "varchar(32)")
  startDay: Int!
  endDay: Int!
  status: String! @default(value: "approved") @col(dataType: "varchar(32)")
  note: String
  approvedBy: User
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Ligne d'heures travaillee, validable avant paie.
type SossonWorkTimeEntry @table {
  member: SossonTeamMember!
  chantier: Chantier
  planningEvent: PlanningEvent
  planningAssignment: PlanningAssignment
  jobSheet: PlanningJobSheet
  workDate: Date!
  hours: Float! @col(dataType: "numeric(6, 2)")
  kind: String! @default(value: "chantier") @col(dataType: "varchar(32)")
  status: String! @default(value: "draft") @col(dataType: "varchar(32)")
  notes: String
  approvedBy: User
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Preparation paie par membre et periode. Ce n'est pas un bulletin legal: la
# table sert a consolider les donnees RH avant export/compta.
type SossonPayrollPeriod @table {
  member: SossonTeamMember!
  periodLabel: String! @col(dataType: "varchar(32)")
  year: Int!
  month: Int!
  baseSalaryGrossMonthly: Float @col(dataType: "numeric(12, 2)")
  overtimeHours: Float @default(value: 0) @col(dataType: "numeric(6, 2)")
  paidLeaveDays: Float @default(value: 0) @col(dataType: "numeric(6, 2)")
  absenceDays: Float @default(value: 0) @col(dataType: "numeric(6, 2)")
  grossEstimate: Float @col(dataType: "numeric(12, 2)")
  status: String! @default(value: "draft") @col(dataType: "varchar(32)")
  notes: String
  dateModification: Timestamp! @default(expr: "request.time")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Client final ou prospect. Un client peut exister avant tout chantier confirme.
type Client @table {
  # Origine metier de la ligne:
  # - "operationnel": client vivant du hub Sosson
  # - "previsionnel": client cree par l'import historique Excel
  origineImport: String! @default(value: "operationnel") @col(dataType: "varchar(32)")
  # Type de client : "particulier" | "professionnel" | "public"
  type: String! @col(dataType: "varchar(32)")
  nom: String! @col(dataType: "varchar(200)")
  prenom: String @col(dataType: "varchar(120)")
  email: String @col(dataType: "varchar(254)")
  telephone: String @col(dataType: "varchar(32)")
  adresse: String @col(dataType: "varchar(255)")
  ville: String @col(dataType: "varchar(120)")
  codePostal: String @col(dataType: "varchar(16)")
  typeChantierCible: String @col(dataType: "varchar(120)")
  souhaits: String
  notes: String
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Chantier : dossier opérationnel rattaché à un client.
# Un chantier peut être affecté à un chef de chantier (User) — optionnel au démarrage.
type Chantier @table {
  # Origine metier de la ligne:
  # - "operationnel": chantier vivant du hub Sosson
  # - "previsionnel": chantier historique issu du classeur Excel
  origineImport: String! @default(value: "operationnel") @col(dataType: "varchar(32)")
  client: Client!
  chefChantier: User
  nom: String! @col(dataType: "varchar(200)")
  # Statut : "prospect" | "devis_a_faire" | "devis_envoye" | "signe"
  #        | "en_preparation" | "en_cours" | "en_pause" | "termine"
  #        | "cloture" | "annule"
  statut: String! @col(dataType: "varchar(32)")
  dateDebut: Date!
  dateFinPrevue: Date!
  # Date de clôture réelle — null tant que le chantier n'est pas clôturé.
  dateFin: Date
  budgetPrevisionnel: Float! @col(dataType: "numeric(12, 2)")
  description: String
  adresse: String @col(dataType: "varchar(255)")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Devis: objet metier entre la demande client/prospect et le chantier confirme.
# Un devis est toujours rattache au client et peut etre rattache a un chantier
# quand le projet est suffisamment clair ou signe.
type Devis @table {
  client: Client!
  chantier: Chantier
  numeroDevis: String! @col(dataType: "varchar(64)")
  titre: String! @col(dataType: "varchar(200)")
  # Statut : "devis_demande" | "devis_envoye" | "devis_signe"
  statut: String! @col(dataType: "varchar(32)")
  montantHT: Float @col(dataType: "numeric(12, 2)")
  # Taux de TVA en pourcentage (ex : 20.0, 10.0, 5.5)
  tva: Float @col(dataType: "numeric(5, 2)")
  montantTTC: Float @col(dataType: "numeric(12, 2)")
  dateDemande: Date!
  dateEnvoi: Date
  dateSignature: Date
  typeChantierCible: String @col(dataType: "varchar(120)")
  description: String
  dateCreation: Timestamp! @default(expr: "request.time")
  dateModification: Timestamp! @default(expr: "request.time")
}


# Facture fournisseur rattachee a un chantier.
# Le montant TTC est stocke en dur (coherence comptable) et non recalcule depuis HT/TVA,
# pour rester aligne avec ce que le fournisseur a reellement facture.
type Facture @table {
  chantier: Chantier!
  fournisseur: String! @col(dataType: "varchar(200)")
  numeroFacture: String! @col(dataType: "varchar(64)")
  montantHT: Float! @col(dataType: "numeric(12, 2)")
  # Taux de TVA en pourcentage (ex : 20.0, 10.0, 5.5)
  tva: Float! @col(dataType: "numeric(5, 2)")
  montantTTC: Float! @col(dataType: "numeric(12, 2)")
  date: Date!
  # Categorie/poste de cout: "bois_materiaux" | "electricite" | "materiaux"
  #           | "quincaillerie" | "sous_traitance" | "carburant"
  #           | "location_materiel" | "plomberie" | "peinture" | "autre"
  categorie: String! @col(dataType: "varchar(48)")
  # Statut de classement: "validee" | "en_attente" | "rejetee".
  # Metier: une facture fournisseur importee est definitive et impacte les
  # chiffres dashboard/statistiques, quel que soit ce statut de classement.
  statut: String! @col(dataType: "varchar(16)")
  description: String
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Dossier documentaire utilisateur.
# Les dossiers permettent un rangement manuel proche d'un explorateur de fichiers.
type DocumentFolder @table {
  nom: String! @col(dataType: "varchar(120)")
  slug: String! @col(dataType: "varchar(140)")
  parent: DocumentFolder
  client: Client
  chantier: Chantier
  description: String
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Document attache a un client, un chantier ou une facture.
# Le fichier binaire reste dans Firebase Storage ; SQL Connect conserve les
# metadonnees, le statut de classement et les liens metier.
type DocumentAttache @table {
  folder: DocumentFolder
  client: Client
  chantier: Chantier
  devis: Devis
  facture: Facture
  nomFichier: String! @col(dataType: "varchar(255)")
  storagePath: String! @col(dataType: "varchar(500)")
  mimeType: String @col(dataType: "varchar(120)")
  tailleBytes: Int
  sha256: String @col(dataType: "varchar(64)")
  # Type : "facture" | "devis" | "plan" | "photo" | "attestation"
  #      | "compte_rendu" | "email_piece_jointe" | "import" | "autre"
  typeDocument: String! @col(dataType: "varchar(48)")
  # Statut : "a_classer" | "lie" | "action_requise" | "archive"
  statut: String! @col(dataType: "varchar(32)")
  # Source : "upload" | "email" | "facture" | "import" | "systeme"
  source: String! @col(dataType: "varchar(32)")
  description: String
  dateDocument: Date
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Import du classeur previsionnel source.
# Un batch conserve la trace du fichier Excel et permet de regenerer/importer
# les lignes sans perdre leur provenance.
type PrevisionnelImportBatch @table {
  workbook: String! @col(dataType: "varchar(200)")
  sourcePath: String! @col(dataType: "varchar(255)")
  workbookHash: String @col(dataType: "varchar(64)")
  importedAt: Timestamp! @default(expr: "request.time")
  notes: String
}


# Exercice du previsionnel, ex. "2025-26".
type PrevisionnelExercise @table {
  batch: PrevisionnelImportBatch!
  sheet: String! @col(dataType: "varchar(32)")
  exercise: String! @col(dataType: "varchar(16)")
  startYear: Int!
  endYear: Int!
  lineCount: Int!
  chantierCount: Int!
  caPrevision: Float! @col(dataType: "numeric(14, 2)")
  caContrat: Float! @col(dataType: "numeric(14, 2)")
  plannedTotal: Float! @col(dataType: "numeric(14, 2)")
  realizedTotal: Float! @col(dataType: "numeric(14, 2)")
  invoicedTotal: Float! @col(dataType: "numeric(14, 2)")
}


# Alias Excel rapproche d'un client canonique.
# Le meme client peut apparaitre sous plusieurs noms dans les onglets historiques.
type ClientAlias @table {
  client: Client!
  alias: String! @col(dataType: "varchar(200)")
  normalizedKey: String! @col(dataType: "varchar(200)")
  source: String! @col(dataType: "varchar(32)")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Ligne source du classeur previsionnel.
# L'identite metier ne repose jamais sur le nom seul : on conserve sheet + row.
type PrevisionnelLine @table {
  exercise: PrevisionnelExercise!
  client: Client!
  chantier: Chantier
  sourceSheet: String! @col(dataType: "varchar(32)")
  sourceRow: Int!
  rawName: String! @col(dataType: "varchar(200)")
  clientKey: String! @col(dataType: "varchar(200)")
  clientName: String! @col(dataType: "varchar(200)")
  category: String! @col(dataType: "varchar(32)")
  lineType: String! @col(dataType: "varchar(32)")
  caTce: Float! @col(dataType: "numeric(14, 2)")
  caPrevision: Float! @col(dataType: "numeric(14, 2)")
  caContrat: Float! @col(dataType: "numeric(14, 2)")
  plannedTotal: Float! @col(dataType: "numeric(14, 2)")
  realizedTotal: Float! @col(dataType: "numeric(14, 2)")
  invoicedTotal: Float! @col(dataType: "numeric(14, 2)")
  invoiceSentTotal: Float! @col(dataType: "numeric(14, 2)")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Montants mensuels d'une ligne previsionnelle.
# `invoiceSent` vient des cellules jaunes : facture envoyee, pas paiement encaisse.
type PrevisionnelMonthlyAmount @table {
  line: PrevisionnelLine!
  month: String! @col(dataType: "varchar(24)")
  label: String! @col(dataType: "varchar(16)")
  monthOrder: Int!
  planned: Float! @col(dataType: "numeric(14, 2)")
  realized: Float! @col(dataType: "numeric(14, 2)")
  invoiceSent: Boolean!
}


# Ventilation par lot / corps d'etat issue du classeur.
type PrevisionnelLotAmount @table {
  line: PrevisionnelLine!
  lotKey: String! @col(dataType: "varchar(64)")
  label: String! @col(dataType: "varchar(120)")
  amount: Float! @col(dataType: "numeric(14, 2)")
}


# Override exact d'une cellule du tableur web previsionnel.
# Sert a conserver toute saisie utilisateur, y compris les cellules hors modele
# analytique mensuel/lots, tout en gardant le template Excel comme reference.
type PrevisionnelCellEdit @table {
  id: String! @col(dataType: "varchar(80)")
  sourceSheet: String! @col(dataType: "varchar(32)")
  cellRef: String! @col(dataType: "varchar(16)")
  valueText: String @col(dataType: "varchar(255)")
  numericValue: Float @col(dataType: "numeric(14, 2)")
  dateModification: Timestamp! @default(expr: "request.time")
}


# =============================================================================
# Emails, planning, analytics et rapports
# =============================================================================
# Outlook / Microsoft Graph reste la source externe des emails. SQL ne devient
# pas une boite mail: il indexe seulement les conversations utiles, leurs liens
# metier, les pieces jointes classees et les preuves d'export.


# Conversation email indexee depuis Outlook/Graph et rattachee au metier.
type EmailThread @table {
  provider: String! @col(dataType: "varchar(32)")
  externalThreadId: String! @col(dataType: "varchar(255)")
  subject: String! @col(dataType: "varchar(255)")
  # Statut: "non_lu" | "a_traiter" | "traite" | "archive"
  statut: String! @col(dataType: "varchar(32)")
  importance: String @col(dataType: "varchar(24)")
  client: Client
  chantier: Chantier
  assignedTo: User
  lastMessageAt: Timestamp!
  participantsSummary: String @col(dataType: "varchar(500)")
  messageCount: Int!
  hasAttachments: Boolean!
  dateCreation: Timestamp! @default(expr: "request.time")
  dateModification: Timestamp! @default(expr: "request.time")
}


# Message email utile, indexe sous un thread. Les corps lourds restent externes
# ou dans Storage via `bodyStoragePath`.
type EmailMessage @table {
  thread: EmailThread!
  externalMessageId: String! @col(dataType: "varchar(255)")
  direction: String! @col(dataType: "varchar(24)")
  fromEmail: String @col(dataType: "varchar(254)")
  fromName: String @col(dataType: "varchar(200)")
  toSummary: String @col(dataType: "varchar(500)")
  ccSummary: String @col(dataType: "varchar(500)")
  subject: String @col(dataType: "varchar(255)")
  bodyPreview: String
  bodyStoragePath: String @col(dataType: "varchar(500)")
  bodyHash: String @col(dataType: "varchar(64)")
  sentAt: Timestamp
  receivedAt: Timestamp!
  isRead: Boolean!
  hasAttachments: Boolean!
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Piece jointe email. Le fichier utile va dans Storage puis peut etre lie a un
# DocumentAttache.
type EmailAttachment @table {
  message: EmailMessage!
  document: DocumentAttache
  externalAttachmentId: String! @col(dataType: "varchar(255)")
  nomFichier: String! @col(dataType: "varchar(255)")
  storagePath: String @col(dataType: "varchar(500)")
  mimeType: String @col(dataType: "varchar(120)")
  tailleBytes: Int
  sha256: String @col(dataType: "varchar(64)")
  statut: String! @col(dataType: "varchar(32)")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Evenement planning rattache optionnellement a un chantier.
type PlanningEvent @table {
  chantier: Chantier
  titre: String! @col(dataType: "varchar(200)")
  eventType: String! @col(dataType: "varchar(48)")
  statut: String! @col(dataType: "varchar(32)")
  startAt: Timestamp!
  endAt: Timestamp!
  location: String @col(dataType: "varchar(255)")
  notes: String
  createdBy: User
  updatedBy: User
  dateCreation: Timestamp! @default(expr: "request.time")
  dateModification: Timestamp! @default(expr: "request.time")
}


# Affectation d'un utilisateur ou d'une equipe a un evenement planning.
type PlanningAssignment @table {
  event: PlanningEvent!
  user: User
  sossonTeam: SossonTeam
  assignmentRole: String @col(dataType: "varchar(80)")
  statut: String! @col(dataType: "varchar(32)")
  notes: String
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Fiche d'intervention issue du planning. Elle relie la carte planning, son
# affectation, le chantier, l'equipe finale et les heures reellement saisies.
type PlanningJobSheet @table {
  event: PlanningEvent!
  assignment: PlanningAssignment
  chantier: Chantier
  sossonTeam: SossonTeam
  leadMember: SossonTeamMember
  titre: String! @col(dataType: "varchar(200)")
  # Statut : "draft" | "ready" | "in_progress" | "completed" | "validated" | "blocked"
  statut: String! @default(value: "draft") @col(dataType: "varchar(32)")
  instructions: String
  plannedHours: Float @col(dataType: "numeric(6, 2)")
  actualHours: Float @col(dataType: "numeric(6, 2)")
  checklist: String
  materials: String
  blockers: String
  completionNotes: String
  proofStoragePath: String @col(dataType: "varchar(500)")
  proofSha256: String @col(dataType: "varchar(64)")
  reportStoragePath: String @col(dataType: "varchar(500)")
  reportSha256: String @col(dataType: "varchar(64)")
  preparedBy: User
  updatedBy: User
  completedBy: User
  validatedBy: User
  completedAt: Timestamp
  validatedAt: Timestamp
  dateModification: Timestamp! @default(expr: "request.time")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Snapshot analytique reproductible pour dashboard, statistiques et rapports.
type AnalyticsSnapshot @table {
  environment: String! @col(dataType: "varchar(32)")
  snapshotType: String! @col(dataType: "varchar(80)")
  scopeType: String! @col(dataType: "varchar(80)")
  scopeId: String @col(dataType: "varchar(120)")
  periodStart: Date
  periodEnd: Date
  status: String! @col(dataType: "varchar(32)")
  totalCaPrevision: Float @col(dataType: "numeric(14, 2)")
  totalCaRealise: Float @col(dataType: "numeric(14, 2)")
  totalFacturesTtc: Float @col(dataType: "numeric(14, 2)")
  totalMarge: Float @col(dataType: "numeric(14, 2)")
  payloadPath: String @col(dataType: "varchar(500)")
  payloadHash: String @col(dataType: "varchar(64)")
  sourceWatermark: String @col(dataType: "varchar(255)")
  createdBy: User
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Rapport genere ou en cours de generation. Les exports lourds restent dans
# Storage, SQL garde le statut, le perimetre et les preuves.
type Rapport @table {
  snapshot: AnalyticsSnapshot
  author: User
  client: Client
  chantier: Chantier
  titre: String! @col(dataType: "varchar(200)")
  rapportType: String! @col(dataType: "varchar(80)")
  statut: String! @col(dataType: "varchar(32)")
  periodeDebut: Date
  periodeFin: Date
  format: String @col(dataType: "varchar(32)")
  storagePath: String @col(dataType: "varchar(500)")
  sha256: String @col(dataType: "varchar(64)")
  summary: String
  generatedAt: Timestamp
  dateCreation: Timestamp! @default(expr: "request.time")
}


# =============================================================================
# Audit, checkpoints et imports
# =============================================================================
# Ces tables forment le premier socle de tracabilite durable.
# Les operations exposees doivent rester append-only: creation et lecture, pas
# d'update/delete depuis le front. Les gros logs et fichiers restent hors SQL
# (Storage ou artefacts), SQL ne conserve que les metadonnees, chemins et hashes.


# Evenement d'audit metier ou technique.
type AuditEvent @table {
  environment: String! @col(dataType: "varchar(32)")
  eventType: String! @col(dataType: "varchar(80)")
  severity: String! @col(dataType: "varchar(24)")
  entityType: String @col(dataType: "varchar(80)")
  entityId: String @col(dataType: "varchar(120)")
  action: String! @col(dataType: "varchar(80)")
  status: String! @col(dataType: "varchar(32)")
  actorUid: String! @default(expr: "auth.uid") @col(dataType: "varchar(128)")
  actorEmail: String @col(dataType: "varchar(254)")
  source: String! @col(dataType: "varchar(80)")
  message: String
  evidencePath: String @col(dataType: "varchar(500)")
  evidenceHash: String @col(dataType: "varchar(64)")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Execution d'un checkpoint local, sandbox ou production.
type CheckpointRun @table {
  environment: String! @col(dataType: "varchar(32)")
  checkpointKey: String! @col(dataType: "varchar(80)")
  title: String! @col(dataType: "varchar(160)")
  status: String! @col(dataType: "varchar(32)")
  startedAt: Timestamp! @default(expr: "request.time")
  finishedAt: Timestamp
  commitSha: String @col(dataType: "varchar(64)")
  sourceBranch: String @col(dataType: "varchar(120)")
  command: String @col(dataType: "varchar(500)")
  actorUid: String! @default(expr: "auth.uid") @col(dataType: "varchar(128)")
  actorEmail: String @col(dataType: "varchar(254)")
  summary: String
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Etape detaillee d'un checkpoint.
type CheckpointStep @table {
  run: CheckpointRun!
  stepKey: String! @col(dataType: "varchar(120)")
  label: String! @col(dataType: "varchar(200)")
  status: String! @col(dataType: "varchar(32)")
  command: String @col(dataType: "varchar(500)")
  exitCode: Int
  durationMs: Int
  startedAt: Timestamp
  finishedAt: Timestamp
  logPath: String @col(dataType: "varchar(500)")
  logHash: String @col(dataType: "varchar(64)")
  message: String
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Preuve ou artefact produit par un checkpoint.
type CheckpointArtifact @table {
  run: CheckpointRun!
  step: CheckpointStep
  artifactType: String! @col(dataType: "varchar(80)")
  path: String! @col(dataType: "varchar(500)")
  storagePath: String @col(dataType: "varchar(500)")
  sha256: String @col(dataType: "varchar(64)")
  sizeBytes: Int
  mimeType: String @col(dataType: "varchar(120)")
  description: String
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Decision humaine rattachee a un checkpoint.
type CheckpointDecision @table {
  run: CheckpointRun!
  decisionType: String! @col(dataType: "varchar(80)")
  status: String! @col(dataType: "varchar(32)")
  decidedByUid: String! @default(expr: "auth.uid") @col(dataType: "varchar(128)")
  decidedByEmail: String @col(dataType: "varchar(254)")
  decisionText: String!
  validationPhraseHash: String @col(dataType: "varchar(64)")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Execution d'import de donnees: Excel, seed local, seed sandbox ou autre source.
type DataImportRun @table {
  environment: String! @col(dataType: "varchar(32)")
  importKind: String! @col(dataType: "varchar(80)")
  sourceName: String! @col(dataType: "varchar(200)")
  sourcePath: String @col(dataType: "varchar(500)")
  sourceHash: String @col(dataType: "varchar(64)")
  status: String! @col(dataType: "varchar(32)")
  startedAt: Timestamp! @default(expr: "request.time")
  finishedAt: Timestamp
  rowCount: Int
  insertedCount: Int
  updatedCount: Int
  skippedCount: Int
  artifactPath: String @col(dataType: "varchar(500)")
  artifactHash: String @col(dataType: "varchar(64)")
  actorUid: String! @default(expr: "auth.uid") @col(dataType: "varchar(128)")
  actorEmail: String @col(dataType: "varchar(254)")
  notes: String
  previsionnelBatch: PrevisionnelImportBatch
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Anomalie detectee pendant un import.
type DataImportIssue @table {
  run: DataImportRun!
  severity: String! @col(dataType: "varchar(24)")
  code: String! @col(dataType: "varchar(80)")
  entityType: String @col(dataType: "varchar(80)")
  entityKey: String @col(dataType: "varchar(200)")
  sourceSheet: String @col(dataType: "varchar(32)")
  sourceRow: Int
  message: String!
  resolutionStatus: String! @col(dataType: "varchar(32)")
  dateCreation: Timestamp! @default(expr: "request.time")
}


# Journal append-only des changements sur les entites metier.
type EntityChangeLog @table {
  environment: String! @col(dataType: "varchar(32)")
  entityType: String! @col(dataType: "varchar(80)")
  entityId: String! @col(dataType: "varchar(120)")
  action: String! @col(dataType: "varchar(80)")
  source: String! @col(dataType: "varchar(80)")
  actorUid: String! @default(expr: "auth.uid") @col(dataType: "varchar(128)")
  actorEmail: String @col(dataType: "varchar(254)")
  beforeHash: String @col(dataType: "varchar(64)")
  afterHash: String @col(dataType: "varchar(64)")
  reason: String
  auditEvent: AuditEvent
  checkpointRun: CheckpointRun
  dataImportRun: DataImportRun
  dateCreation: Timestamp! @default(expr: "request.time")
}
