    folderId: $folderId
    clientId: $clientId
    chantierId: $chantierId
    factureId: $factureId
    nomFichier: $nomFichier
    storagePath: $storagePath
    mimeType: $mimeType
    tailleBytes: $tailleBytes
    typeDocument: $typeDocument
    statut: $statut
    source: $source
    description: $description
    dateDocument: $dateDocument
