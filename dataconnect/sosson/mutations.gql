# =============================================================================
# Mutations — connecteur `sosson`
# =============================================================================
# Toutes les écritures requièrent une session Firebase Auth active.
# Les opérations sensibles vérifient aussi le profil SQL `User` par `auth.uid`
# et le rôle applicatif via des règles `@check`.
# =============================================================================


# ---------- Clients ----------------------------------------------------------

mutation CreateClient(
  $type: String!
  $nom: String!
  $email: String
  $telephone: String
  $adresse: String
  $ville: String
  $codePostal: String
) @auth(
  level: USER
  insecureReason: "Internal back-office app for a single company; authenticated staff create clients from trusted UI flows and the transaction checks the SQL User role."
) @transaction {
  query {
    currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
      role @check(expr: "this in ['gerant', 'assistante']", message: "Role insuffisant pour creer un client.")
    }
  }
  client_insert(data: {
    type: $type
    nom: $nom
    email: $email
    telephone: $telephone
    adresse: $adresse
    ville: $ville
    codePostal: $codePostal
  })
}

mutation UpdateClient(
  $id: UUID!
  $type: String
  $nom: String
  $email: String
  $telephone: String
  $adresse: String
  $ville: String
  $codePostal: String
) @auth(
  level: USER
  insecureReason: "Internal back-office app for a single company; authenticated staff update clients from trusted UI flows and the transaction checks the SQL User role."
) @transaction {
  query {
    currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
      role @check(expr: "this in ['gerant', 'assistante']", message: "Role insuffisant pour modifier un client.")
    }
  }
  client_update(id: $id, data: {
    type: $type
    nom: $nom
    email: $email
    telephone: $telephone
    adresse: $adresse
    ville: $ville
    codePostal: $codePostal
  })
}


