    importKind: $importKind
    sourceName: $sourceName
    sourcePath: $sourcePath
    sourceHash: $sourceHash
    status: $status
    finishedAt: $finishedAt
    rowCount: $rowCount
    insertedCount: $insertedCount
    updatedCount: $updatedCount
    skippedCount: $skippedCount
    artifactPath: $artifactPath
    artifactHash: $artifactHash
    actorEmail: $actorEmail
    notes: $notes
    previsionnelBatchId: $previsionnelBatchId
  })
}

mutation CreateDataImportIssue(
  $runId: UUID!
  $severity: String!
  $code: String!
  $entityType: String
  $entityKey: String
  $sourceSheet: String
  $sourceRow: Int
  $message: String!
  $resolutionStatus: String!
) @auth(
  level: USER
  insecureReason: "Internal back-office app; authenticated staff can append data import issues for traceability."
) @transaction {
  query {
    currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
      role @check(expr: "this in ['gerant', 'assistante']", message: "Role insuffisant pour creer une anomalie d'import.")
    }
  }
  dataImportIssue_insert(data: {
    runId: $runId
    severity: $severity
    code: $code
    entityType: $entityType
    entityKey: $entityKey
    sourceSheet: $sourceSheet
    sourceRow: $sourceRow
    message: $message
    resolutionStatus: $resolutionStatus
  })
}

