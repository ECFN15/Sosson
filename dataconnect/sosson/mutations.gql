    rapportType: $rapportType
    statut: $statut
    periodeDebut: $periodeDebut
    periodeFin: $periodeFin
    format: $format
    storagePath: $storagePath
    sha256: $sha256
    summary: $summary
    generatedAt: $generatedAt
  })
}

mutation MarkRapportGenerated(
  $id: UUID!
  $statut: String!
  $format: String
  $storagePath: String
  $sha256: String
  $generatedAt: Timestamp
  $summary: String
) @auth(
  level: USER
  insecureReason: "Internal back-office app; authenticated managers can mark report exports as generated."
) @transaction {
  query {
    currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
      role @check(expr: "this in ['gerant', 'assistante']", message: "Role insuffisant pour finaliser un rapport.")
    }
  }
  rapport_update(id: $id, data: {
    statut: $statut
    format: $format
    storagePath: $storagePath
    sha256: $sha256
    generatedAt: $generatedAt
    summary: $summary
  })
}


