# =============================================================================
# Mutations — connecteur `sosson`
# =============================================================================
# Toutes les écritures requièrent une session Firebase Auth active.
# Les opérations sensibles vérifient aussi le profil SQL `User` par `auth.uid`
# et le rôle applicatif via des règles `@check`.
# =============================================================================


# ---------- Onboarding equipe ------------------------------------------------

mutation SubmitCurrentTeamProfile(
  $email: String!
  $nom: String!
  $prenom: String!
  $requestedTeamType: String!
  $sourceConnexion: String
) @auth(
  level: USER
  insecureReason: "Authenticated staff can submit only their own onboarding request keyed by auth.uid; this mutation never creates a User role or application access."
) @transaction {
  teamProfileSubmission_upsert(data: {
    id_expr: "auth.uid"
    email: $email
    nom: $nom
    prenom: $prenom
    requestedTeamType: $requestedTeamType
    status: "pending"
    sourceConnexion: $sourceConnexion
    dateModification_expr: "request.time"
  })
}

mutation ConvertTeamProfileSubmission(
  $id: String!
  $email: String!
  $nom: String!
  $prenom: String!
  $role: String!
  $avatar: String
  $equipeTypeSouhaite: String
  $equipeFinaleId: String
  $poste: String
  $telephone: String
  $sourceConnexion: String
  $convertedMemberId: String
  $reviewNote: String
) @auth(
  level: USER
  insecureReason: "Internal back-office app for a single company; only a SQL gerant can convert an onboarding request into an application profile."
) @transaction {
  query {
    currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
      role @check(expr: "this in ['gerant']", message: "Role gerant requis pour convertir un profil.")
    }
    targetSubmission: teamProfileSubmission(key: { id: $id }) @check(expr: "this != null", message: "Demande onboarding introuvable.") @redact {
      status @check(expr: "this == 'pending'", message: "Demande onboarding deja traitee.")
    }
  }
  user_upsert(data: {
    id: $id
    email: $email
    nom: $nom
    prenom: $prenom
    role: $role
    profilStatut: "actif"
    equipeTypeSouhaite: $equipeTypeSouhaite
    equipeFinaleId: $equipeFinaleId
    poste: $poste
    telephone: $telephone
    sourceConnexion: $sourceConnexion
    avatar: $avatar
    dateActivation_expr: "request.time"
    dateModification_expr: "request.time"
  })
  teamProfileSubmission_update(id: $id, data: {
    status: "converted"
    convertedTeamId: $equipeFinaleId
    convertedMemberId: $convertedMemberId
    reviewNote: $reviewNote
    reviewedById_expr: "auth.uid"
    reviewedAt_expr: "request.time"
    dateModification_expr: "request.time"
  })
}


