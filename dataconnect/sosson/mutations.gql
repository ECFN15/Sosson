# =============================================================================
# Mutations — connecteur `sosson`
# =============================================================================
# Toutes les écritures requièrent une session Firebase Auth active.
# Les contrôles fins de permission par rôle (qui peut créer un chantier,
# qui peut valider une facture, etc.) sont ajoutés ensuite via :
#   - restrictions applicatives côté front / fonctions
#   - règles `@check` sur les opérations sensibles
# =============================================================================


# ---------- Utilisateur courant ---------------------------------------------

# Crée ou met à jour le profil de l'utilisateur authentifié.
# L'ID est forcé à `auth.uid` côté serveur — un utilisateur ne peut écrire
# que son propre profil.
mutation UpsertCurrentUser(
  $email: String!
  $nom: String!
  $prenom: String!
  $role: String!
  $avatar: String
) @auth(
  level: USER
) {
  user_upsert(data: {
    id_expr: "auth.uid"
    email: $email
    nom: $nom
    prenom: $prenom
    role: $role
    avatar: $avatar
  })
}


# ---------- Clients ----------------------------------------------------------

mutation CreateClient(
  $type: String!
  $nom: String!
  $email: String
  $telephone: String
  $adresse: String
  $ville: String
  $codePostal: String
) @auth(
  level: USER
  insecureReason: "Internal back-office app for a single company; authenticated staff create clients from trusted UI flows while database-level role checks are added in a later hardening pass."
) {
  client_insert(data: {
    type: $type
    nom: $nom
    email: $email
    telephone: $telephone
    adresse: $adresse
    ville: $ville
    codePostal: $codePostal
  })
}

mutation UpdateClient(
  $id: UUID!
  $type: String
  $nom: String
  $email: String
  $telephone: String
  $adresse: String
  $ville: String
  $codePostal: String
) @auth(
  level: USER
  insecureReason: "Internal back-office app for a single company; authenticated staff update clients from trusted UI flows while database-level role checks are added in a later hardening pass."
) {
  client_update(id: $id, data: {
    type: $type
    nom: $nom
    email: $email
    telephone: $telephone
    adresse: $adresse
    ville: $ville
    codePostal: $codePostal
  })
}


