    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read consolidated previsionnel analytics."
  ) {
  previsionnelExercises(orderBy: { exercise: ASC }) {
    id
    sheet
    exercise
    startYear
    endYear
    lineCount
    chantierCount
    caPrevision
    caContrat
    plannedTotal
    realizedTotal
    invoicedTotal
    batch {
      id
      workbook
      sourcePath
      workbookHash
      importedAt
    }
  }
}

query ListPrevisionnelLinesByExercise($exerciseId: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can inspect imported previsionnel lines."
  ) {
  previsionnelLines(where: { exerciseId: { eq: $exerciseId } }, orderBy: { sourceRow: ASC }, limit: 300) {
    id
    sourceSheet
    sourceRow
    rawName
    clientKey
    clientName
    category
    lineType
    caTce
    caPrevision
    caContrat
    plannedTotal
    realizedTotal
    invoicedTotal
