query GetChantier($id: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared chantier access while fine-grained RBAC is still enforced in the application layer."
  ) {
  chantier(id: $id) {
    id
    nom
    statut
    dateDebut
    dateFinPrevue
    dateFin
    budgetPrevisionnel
    description
    adresse
    client {
      id
      nom
      type
      prenom
      email
      telephone
      adresse
      ville
      codePostal
      typeChantierCible
      souhaits
      notes
    }
    chefChantier { id nom prenom email avatar }
    devis: deviss_on_chantier(orderBy: { dateCreation: DESC }, limit: 100) {
      id
      numeroDevis
      titre
      statut
      montantHT
      tva
      montantTTC
      dateDemande
      dateEnvoi
      dateSignature
      client { id nom type }
    }
    factures: factures_on_chantier(orderBy: { date: DESC }) {
      id
      fournisseur
      numeroFacture
      montantHT
      tva
      montantTTC
      date
      categorie
      statut
      description
    }
  }
}


