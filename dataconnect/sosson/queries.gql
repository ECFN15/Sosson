# ---------- Audit, checkpoints et imports -----------------------------------

query ListRecentAuditEvents($environment: String!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read audit indexes for operational traceability."
  ) {
  auditEvents(where: { environment: { eq: $environment } }, orderBy: { dateCreation: DESC }, limit: 200) {
    id
    environment
    eventType
    severity
    entityType
    entityId
    action
    status
    actorUid
    actorEmail
    source
    message
    evidencePath
    evidenceHash
    dateCreation
  }
}

query ListEntityChangeLogs($environment: String!, $entityType: String!, $entityId: String!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read entity change history."
  ) {
  entityChangeLogs(
    where: {
      environment: { eq: $environment }
      entityType: { eq: $entityType }
      entityId: { eq: $entityId }
    }
    orderBy: { dateCreation: DESC }
    limit: 300
  ) {
    id
    environment
    entityType
    entityId
    action
    source
    actorUid
    actorEmail
    beforeHash
    afterHash
    reason
    dateCreation
    auditEvent { id eventType action status evidencePath evidenceHash }
    checkpointRun { id checkpointKey status }
    dataImportRun { id importKind sourceName status }
  }
}

query ListCheckpointRuns($environment: String!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read checkpoint run indexes."
  ) {
  checkpointRuns(where: { environment: { eq: $environment } }, orderBy: { dateCreation: DESC }, limit: 100) {
    id
    environment
    checkpointKey
    title
    status
    startedAt
    finishedAt
    commitSha
    sourceBranch
    command
    actorUid
    actorEmail
    summary
    dateCreation
  }
}

query GetCheckpointRun($id: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read checkpoint run evidence metadata."
  ) {
  checkpointRun(id: $id) {
    id
    environment
    checkpointKey
    title
    status
    startedAt
    finishedAt
    commitSha
    sourceBranch
    command
    actorUid
    actorEmail
    summary
    dateCreation
    steps: checkpointSteps_on_run(orderBy: { dateCreation: ASC }, limit: 1000) {
      id
      stepKey
      label
      status
      command
      exitCode
      durationMs
      startedAt
      finishedAt
      logPath
      logHash
      message
      dateCreation
    }
    artifacts: checkpointArtifacts_on_run(orderBy: { dateCreation: ASC }, limit: 1000) {
      id
      artifactType
      path
      storagePath
      sha256
      sizeBytes
      mimeType
      description
      step { id stepKey label status }
      dateCreation
    }
    decisions: checkpointDecisions_on_run(orderBy: { dateCreation: ASC }, limit: 100) {
      id
      decisionType
      status
      decidedByUid
      decidedByEmail
      decisionText
      validationPhraseHash
      dateCreation
    }
  }
}

