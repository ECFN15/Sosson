query ListPlanningEventsByPeriod($startAt: Timestamp!, $endAt: Timestamp!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read shared planning."
  ) {
  currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
    role @check(expr: "this in ['gerant', 'assistante', 'chef_chantier']", message: "Role insuffisant pour lire le planning.")
  }
  planningEvents(where: { startAt: { ge: $startAt }, endAt: { le: $endAt } }, orderBy: { startAt: ASC }, limit: 500) {
    id
    titre
    eventType
    statut
    startAt
    endAt
    location
    notes
    chantier { id nom statut client { id nom } }
    createdBy { id nom prenom avatar }
    updatedBy { id nom prenom avatar }
    assignmentsByPeriod: planningAssignments_on_event(orderBy: { dateCreation: ASC }, limit: 100) {
      id
      assignmentRole
      statut
      notes
      sossonTeam { id code name type theme }
      user { id nom prenom avatar role }
    }
    jobSheetsByPeriod: planningJobSheets_on_event(orderBy: { dateCreation: DESC }, limit: 20) {
      id
      titre
      statut
      instructions
      plannedHours
      actualHours
      checklist
      materials
      blockers
      completionNotes
      proofStoragePath
      proofSha256
      reportStoragePath
      reportSha256
      completedAt
      validatedAt
      dateModification
      dateCreation
      assignment { id statut assignmentRole }
      chantier { id nom statut }
      sossonTeam { id code name type theme }
      leadMember { id firstName lastName title }
      preparedBy { id nom prenom avatar }
      updatedBy { id nom prenom avatar }
      completedBy { id nom prenom avatar }
      validatedBy { id nom prenom avatar }
      workTimesByPeriodJobSheet: sossonWorkTimeEntries_on_jobSheet(orderBy: { workDate: DESC }, limit: 100) {
        id
        workDate
        hours
        kind
        status
        notes
        member { id firstName lastName title }
      }
    }
  }
}

