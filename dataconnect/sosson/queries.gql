# ---------- Documents --------------------------------------------------------

query ListDocumentFolders
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared document folder access."
  ) {
  documentFolders(orderBy: { nom: ASC }, limit: 500) {
    id
    nom
    slug
    description
    dateCreation
    parent { id nom slug }
    client { id nom type }
    chantier { id nom statut client { id nom type } }
  }
}

query ListDocumentsAttaches
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared document metadata access while file-level hardening is handled in Storage rules."
  ) {
  documentAttaches(orderBy: { dateCreation: DESC }, limit: 1000) {
    id
    nomFichier
    storagePath
    mimeType
    tailleBytes
    sha256
    typeDocument
    statut
    source
    description
    dateDocument
    dateCreation
    folder { id nom slug }
    client { id nom type }
    chantier {
      id
      nom
      statut
      client { id nom type }
    }
    devis {
      id
      numeroDevis
      titre
      statut
      client { id nom type }
      chantier { id nom statut }
    }
    facture {
      id
      fournisseur
      numeroFacture
      montantTTC
      date
      statut
      chantier {
        id
        nom
        client { id nom type }
      }
    }
  }
}

query ListDocumentsByChantier($chantierId: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared chantier document metadata access."
  ) {
  documentAttaches(where: { chantierId: { eq: $chantierId } }, orderBy: { dateCreation: DESC }, limit: 300) {
    id
    nomFichier
    storagePath
    mimeType
    tailleBytes
    sha256
    typeDocument
    statut
    source
    description
    dateDocument
    dateCreation
    folder { id nom slug }
    client { id nom type }
    chantier { id nom statut client { id nom type } }
    devis { id numeroDevis titre statut client { id nom type } chantier { id nom statut } }
    facture { id fournisseur numeroFacture montantTTC date statut }
  }
}


# ---------- Previsionnel -----------------------------------------------------

query ListPrevisionnelExercises
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read consolidated previsionnel analytics."
  ) {
  previsionnelExercises(orderBy: { exercise: ASC }) {
    id
    sheet
    exercise
    startYear
    endYear
    lineCount
    chantierCount
    caPrevision
    caContrat
    plannedTotal
    realizedTotal
    invoicedTotal
    batch {
      id
      workbook
      sourcePath
      workbookHash
      importedAt
    }
  }
}

query ListPrevisionnelLinesByExercise($exerciseId: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can inspect imported previsionnel lines."
  ) {
  previsionnelLines(where: { exerciseId: { eq: $exerciseId } }, orderBy: { sourceRow: ASC }, limit: 300) {
    id
    sourceSheet
    sourceRow
    rawName
    clientKey
    clientName
    category
    lineType
    caTce
    caPrevision
    caContrat
    plannedTotal
    realizedTotal
    invoicedTotal
    invoiceSentTotal
    client { id nom type }
    chantier { id nom statut dateDebut dateFinPrevue budgetPrevisionnel }
    monthly: previsionnelMonthlyAmounts_on_line(orderBy: { monthOrder: ASC }) {
      id
      month
      label
      monthOrder
      planned
      realized
      invoiceSent
    }
    lots: previsionnelLotAmounts_on_line(orderBy: { lotKey: ASC }) {
      id
      lotKey
      label
      amount
    }
  }
}

query SearchClientAliases($normalizedKey: String!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can inspect Excel aliases linked to clients."
  ) {
  clientAliases(where: { normalizedKey: { eq: $normalizedKey } }, orderBy: { alias: ASC }) {
    id
    alias
    normalizedKey
    source
    client { id nom type }
  }
}

query ListPrevisionnelCellEdits($sourceSheet: String!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can load saved previsionnel cell overrides for the current sheet."
  ) {
  previsionnelCellEdits(where: { sourceSheet: { eq: $sourceSheet } }, orderBy: { cellRef: ASC }, limit: 10000) {
    id
    sourceSheet
    cellRef
    valueText
    numericValue
    dateModification
  }
}


# ---------- Emails, planning, analytics et rapports --------------------------

query ListEmailThreads
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read the business email index while Outlook remains the external source."
  ) {
  emailThreads(orderBy: { lastMessageAt: DESC }, limit: 200) {
    id
    provider
    externalThreadId
    subject
    statut
    importance
    lastMessageAt
    participantsSummary
    messageCount
    hasAttachments
    dateModification
    client { id nom type }
    chantier { id nom statut client { id nom } }
    assignedTo { id nom prenom avatar }
  }
}

query ListUnreadEmailThreads
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read actionable email thread indexes."
  ) {
  emailThreads(where: { statut: { eq: "a_traiter" } }, orderBy: { lastMessageAt: DESC }, limit: 100) {
    id
    provider
    externalThreadId
    subject
    statut
    importance
    lastMessageAt
    participantsSummary
    messageCount
    hasAttachments
    client { id nom type }
    chantier { id nom statut }
    assignedTo { id nom prenom avatar }
  }
}

query GetEmailThread($id: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read messages indexed for business processing."
  ) {
  emailThread(id: $id) {
    id
    provider
    externalThreadId
    subject
    statut
    importance
    lastMessageAt
    participantsSummary
    messageCount
    hasAttachments
    dateCreation
    dateModification
    client { id nom type email telephone }
    chantier { id nom statut client { id nom type } }
    assignedTo { id nom prenom email avatar }
    messages: emailMessages_on_thread(orderBy: { receivedAt: DESC }, limit: 300) {
      id
      externalMessageId
      direction
      fromEmail
      fromName
      toSummary
      ccSummary
      subject
      bodyPreview
      bodyStoragePath
      bodyHash
      sentAt
      receivedAt
      isRead
      hasAttachments
      attachments: emailAttachments_on_message(orderBy: { dateCreation: ASC }, limit: 100) {
        id
        externalAttachmentId
        nomFichier
        storagePath
        mimeType
        tailleBytes
        sha256
        statut
        document { id nomFichier storagePath statut typeDocument }
      }
    }
  }
}

query ListPlanningEventsByPeriod($startAt: Timestamp!, $endAt: Timestamp!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read shared planning."
  ) {
  planningEvents(where: { startAt: { ge: $startAt }, endAt: { le: $endAt } }, orderBy: { startAt: ASC }, limit: 500) {
    id
    titre
    eventType
    statut
    startAt
    endAt
    location
    notes
    chantier { id nom statut client { id nom } }
    createdBy { id nom prenom avatar }
    updatedBy { id nom prenom avatar }
    assignmentsByPeriod: planningAssignments_on_event(orderBy: { dateCreation: ASC }, limit: 100) {
      id
      assignmentRole
      statut
      notes
      user { id nom prenom avatar role }
    }
  }
}

query ListPlanningEventsByChantier($chantierId: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can read planning linked to a chantier."
  ) {
  planningEvents(where: { chantierId: { eq: $chantierId } }, orderBy: { startAt: ASC }, limit: 300) {
    id
    titre
    eventType
    statut
    startAt
    endAt
    location
    notes
    assignmentsByChantier: planningAssignments_on_event(orderBy: { dateCreation: ASC }, limit: 100) {
      id
      assignmentRole
      statut
      user { id nom prenom avatar role }
    }
  }
}

