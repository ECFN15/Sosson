# =============================================================================
# Queries — connecteur `sosson`
# =============================================================================
# Toutes les lectures sont réservées aux utilisateurs Firebase Auth authentifiés.
# Le RBAC fin (gérant / assistante / chef_chantier) est géré au niveau applicatif
# à partir du rôle lu via `GetCurrentUser` — pas dans ces queries.
# =============================================================================


# ---------- Utilisateur courant ---------------------------------------------

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    email
    nom
    prenom
    role
    avatar
  }
}

query ListUsers
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff can inspect provisioned application profiles while role changes remain admin/provisioning-only."
  ) {
  users(orderBy: { nom: ASC }, limit: 100) {
    id
    email
    nom
    prenom
    role
    avatar
    dateCreation
  }
}


# ---------- Clients ----------------------------------------------------------

query ListOperationalClients
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared client access while fine-grained RBAC is still enforced in the application layer."
  ) {
  clients(where: { origineImport: { eq: "operationnel" } }, orderBy: { nom: ASC }, limit: 1000) {
    id
    type
    nom
    prenom
    email
    telephone
    adresse
    ville
    codePostal
    typeChantierCible
    souhaits
    notes
    dateCreation
  }
}

query GetClient($id: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared client access while fine-grained RBAC is still enforced in the application layer."
  ) {
  client(id: $id) {
    id
    type
    nom
    prenom
    email
    telephone
    adresse
    ville
    codePostal
    typeChantierCible
    souhaits
    notes
    dateCreation
    devis: deviss_on_client(orderBy: { dateCreation: DESC }, limit: 100) {
      id
      numeroDevis
      titre
      statut
      montantTTC
      dateDemande
      dateEnvoi
      dateSignature
      chantier { id nom statut }
    }
    chantiers: chantiers_on_client(orderBy: { dateDebut: DESC }) {
      id
      nom
      statut
      dateDebut
      dateFinPrevue
      budgetPrevisionnel
    }
  }
}


# ---------- Chantiers --------------------------------------------------------

query ListOperationalChantiers
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared chantier access while fine-grained RBAC is still enforced in the application layer."
  ) {
  chantiers(where: { origineImport: { eq: "operationnel" } }, orderBy: { dateDebut: DESC }, limit: 1200) {
    id
    nom
    statut
    dateDebut
    dateFinPrevue
    dateFin
    budgetPrevisionnel
    adresse
    client { id nom type ville }
    chefChantier { id nom prenom avatar }
  }
}

query GetChantier($id: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared chantier access while fine-grained RBAC is still enforced in the application layer."
  ) {
  chantier(id: $id) {
    id
    nom
    statut
    dateDebut
    dateFinPrevue
    dateFin
    budgetPrevisionnel
    description
    adresse
    client {
      id
      nom
      type
      prenom
      email
      telephone
      adresse
      ville
      codePostal
      typeChantierCible
      souhaits
      notes
    }
    chefChantier { id nom prenom email avatar }
    devis: deviss_on_chantier(orderBy: { dateCreation: DESC }, limit: 100) {
      id
      numeroDevis
      titre
      statut
      montantHT
      tva
      montantTTC
      dateDemande
      dateEnvoi
      dateSignature
      client { id nom type }
    }
    factures: factures_on_chantier(orderBy: { date: DESC }) {
      id
      fournisseur
      numeroFacture
      montantHT
      tva
      montantTTC
      date
      categorie
      statut
      description
    }
  }
}


