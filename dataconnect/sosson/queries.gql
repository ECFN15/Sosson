# =============================================================================
# Queries — connecteur `sosson`
# =============================================================================
# Toutes les lectures sont réservées aux utilisateurs Firebase Auth authentifiés.
# Le RBAC fin (gérant / assistante / chef_chantier) est géré au niveau applicatif
# à partir du rôle lu via `GetCurrentUser` — pas dans ces queries.
# =============================================================================


# ---------- Utilisateur courant ---------------------------------------------

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    email
    nom
    prenom
    role
    profilStatut
    equipeTypeSouhaite
    equipeFinaleId
    poste
    telephone
    sourceConnexion
    avatar
  }
}

query ListUsers
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff can inspect provisioned application profiles while role changes remain admin/provisioning-only."
  ) {
  currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
    role @check(expr: "this in ['gerant', 'assistante', 'chef_chantier']", message: "Role insuffisant pour lire les profils equipe.")
  }
  users(orderBy: { nom: ASC }, limit: 100) {
    id
    email
    nom
    prenom
    role
    profilStatut
    equipeTypeSouhaite
    equipeFinaleId
    poste
    telephone
    sourceConnexion
    avatar
    dateCreation
  }
}

query GetCurrentTeamProfileSubmission @auth(level: USER) {
  teamProfileSubmission(key: { id_expr: "auth.uid" }) {
    id
    email
    nom
    prenom
    requestedTeamType
    status
    sourceConnexion
    convertedTeamId
    convertedMemberId
    reviewNote
    reviewedAt
    reviewedBy { id nom prenom avatar }
    dateModification
    dateCreation
  }
}

query ListTeamProfileSubmissions
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated managers can inspect onboarding submissions before converting them into application profiles."
  ) {
  currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
    role @check(expr: "this in ['gerant']", message: "Role gerant requis pour lire les demandes onboarding.")
  }
  teamProfileSubmissions(orderBy: { dateCreation: DESC }, limit: 100) {
    id
    email
    nom
    prenom
    requestedTeamType
    status
    sourceConnexion
    convertedTeamId
    convertedMemberId
    reviewNote
    reviewedAt
    reviewedBy { id nom prenom avatar }
    dateModification
    dateCreation
  }
}

query ListSossonTeams
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff can inspect final teams and HR cards while write operations remain role-checked."
  ) {
  currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
    role @check(expr: "this in ['gerant', 'assistante', 'chef_chantier']", message: "Role insuffisant pour lire les equipes finales.")
  }
  sossonTeams(orderBy: { ordre: ASC }, limit: 100) {
    id
    code
    name
    type
    statut
    theme
    leadName
    description
    activeSites
    ordre
    dateModification
    dateCreation
    members: sossonTeamMembers_on_team(orderBy: { lastName: ASC }, limit: 500) {
      id
      firstName
      lastName
      title
      qualification
      level
      salaryGrossMonthly
      contract
      coefficient
      email
      phone
      status
      site
      activeSites
      responsibilities
      permissions
      dateModification
      dateCreation
      user { id nom prenom email role avatar }
      leaves: sossonTeamLeavePeriods_on_member(orderBy: { dateCreation: DESC }, limit: 100) {
        id
        type
        month
        startDay
        endDay
        status
        note
        dateCreation
      }
    }
  }
}

query ListSossonWorkTimeEntries($startDate: Date!, $endDate: Date!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated staff can inspect work-time rows before payroll consolidation."
  ) {
  currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
    role @check(expr: "this in ['gerant', 'assistante', 'chef_chantier']", message: "Role insuffisant pour lire les heures.")
  }
  sossonWorkTimeEntries(
    where: { workDate: { ge: $startDate, le: $endDate } }
    orderBy: { workDate: DESC }
    limit: 1000
  ) {
    id
    workDate
    hours
    kind
    status
    notes
    dateCreation
    member { id firstName lastName title team { id name code type } }
    chantier { id nom statut client { id nom } }
    planningEvent { id titre startAt endAt statut }
    planningAssignment { id statut assignmentRole }
    jobSheet { id titre statut }
    approvedBy { id nom prenom avatar }
  }
}

query ListSossonPayrollPeriods($year: Int!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app; authenticated managers can inspect payroll preparation rows."
  ) {
  currentUser: user(key: { id_expr: "auth.uid" }) @check(expr: "this != null", message: "Profil SQL requis.") @redact {
    role @check(expr: "this in ['gerant', 'assistante']", message: "Role insuffisant pour lire la preparation paie.")
  }
  sossonPayrollPeriods(where: { year: { eq: $year } }, orderBy: { month: DESC }, limit: 1000) {
    id
    periodLabel
    year
    month
    baseSalaryGrossMonthly
    overtimeHours
    paidLeaveDays
    absenceDays
    grossEstimate
    status
    notes
    dateModification
    dateCreation
    member { id firstName lastName title team { id name code type } }
  }
}


# ---------- Clients ----------------------------------------------------------

query ListOperationalClients
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared client access while fine-grained RBAC is still enforced in the application layer."
  ) {
  clients(where: { origineImport: { eq: "operationnel" } }, orderBy: { nom: ASC }, limit: 1000) {
    id
    type
    nom
    prenom
    email
    telephone
    adresse
    ville
    codePostal
    typeChantierCible
    souhaits
    notes
    dateCreation
  }
}

query GetClient($id: UUID!)
  @auth(
    level: USER
    insecureReason: "Internal back-office app for a single company; authenticated staff need shared client access while fine-grained RBAC is still enforced in the application layer."
  ) {
  client(id: $id) {
    id
    type
    nom
    prenom
    email
    telephone
    adresse
    ville
    codePostal
    typeChantierCible
    souhaits
    notes
    dateCreation
    devis: deviss_on_client(orderBy: { dateCreation: DESC }, limit: 100) {
      id
      numeroDevis
      titre
      statut
      montantTTC
      dateDemande
      dateEnvoi
      dateSignature
      chantier { id nom statut }
    }
    chantiers: chantiers_on_client(orderBy: { dateDebut: DESC }) {
      id
      nom
      statut
      dateDebut
      dateFinPrevue
      budgetPrevisionnel
    }
  }
}


